name: Sincronización diaria de Garmin

on:
  schedule:
    # 16:30 UTC = 10:30 am en Ciudad de México (México ya no cambia de
    # horario de verano/invierno desde 2022, así que es fijo todo el año).
    - cron: "30 16 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python3 sync_diario.py
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
