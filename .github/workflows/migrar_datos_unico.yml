name: Migrar datos de Google Sheets a Postgres (una sola vez)

# Se dispara SOLO a mano, desde la pestaña "Actions" de GitHub -- nunca
# solo, nunca en un cron. Pensado para correrse una vez, verificar que
# los conteos de filas tengan sentido, y borrar este workflow después.

on:
  workflow_dispatch: {}

jobs:
  migrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install gspread google-auth sqlalchemy psycopg2-binary
      - run: python3 migrar_datos.py
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
