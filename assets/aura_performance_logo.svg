<svg width="560" height="130" viewBox="0 0 560 130" xmlns="http://www.w3.org/2000/svg">
  <!-- Isotipo: mismo glifo "A" de las otras identidades, pero sin
       gradientes ni bisel: colores planos (Graphite Black + Lab
       Green), esquinas rectas, cero elementos decorativos, estilo
       lectura de telemetría/laboratorio. -->
  <g>
    <path d="M10,112 L58,22 L106,112" fill="none" stroke="#111111"
          stroke-width="16" stroke-linecap="square" stroke-linejoin="miter"/>

    <path d="M27,63 L44,45 L58,60 L72,75 L89,57" fill="none" stroke="#00FF66"
          stroke-width="9" stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M25,75 L43,59 L58,73 L73,87 L91,69" fill="none" stroke="#00A859"
          stroke-width="9" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>

  <!-- Wordmark + tagline -->
  <text x="140" y="76" font-family="'Bebas Neue', 'Arial Narrow', sans-serif" font-weight="400"
        font-size="52" letter-spacing="2" fill="#111111">AURA</text>
  <text x="142" y="97" font-family="'JetBrains Mono', 'Courier New', monospace"
        font-weight="600" font-size="11" letter-spacing="3.5" fill="#00A859">PERFORMANCE DATA SYSTEM</text>
</svg>
