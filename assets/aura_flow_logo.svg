<svg width="560" height="130" viewBox="0 0 560 130" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C9CDD3"/>
    </linearGradient>
    <linearGradient id="iridescent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2C5E8A"/>
      <stop offset="50%" stop-color="#8C6FB0"/>
      <stop offset="100%" stop-color="#BCA38C"/>
    </linearGradient>
    <radialGradient id="flare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Isotipo: "A" sin travesaño recto; 3 ondas iridiscentes forman la
       barra horizontal, con un destello sutil sobre el vértice. -->
  <g>
    <path d="M14,110 L58,20 L102,110" fill="none" stroke="url(#silver)"
          stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="58" cy="16" r="11" fill="url(#flare)"/>
    <path d="M49,12 Q58,3 67,12" fill="none" stroke="#FFFFFF" stroke-width="1.6"
          stroke-linecap="round" opacity="0.85"/>

    <path d="M31,64 Q45,51 58,62 Q71,73 85,60" fill="none" stroke="url(#iridescent)"
          stroke-width="3.4" stroke-linecap="round"/>
    <path d="M29,73 Q44,62 58,72 Q72,82 87,69" fill="none" stroke="url(#iridescent)"
          stroke-width="3.4" stroke-linecap="round" opacity="0.75"/>
    <path d="M27,82 Q43,73 58,81 Q73,89 89,77" fill="none" stroke="url(#iridescent)"
          stroke-width="3.4" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Wordmark + tagline -->
  <text x="140" y="72" font-family="Syne, 'Arial Black', sans-serif" font-weight="800"
        font-size="40" letter-spacing="2" fill="url(#silver)">AURA FLOW</text>
  <text x="142" y="97" font-family="'JetBrains Mono', 'Courier New', monospace"
        font-weight="600" font-size="11" letter-spacing="4.5" fill="#9AA1AB">COHERENCE FOR HEALTH DATA</text>
</svg>
