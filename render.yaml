# Blueprint de Render -- en vez de configurar cada servicio a mano,
# desde Render: "New +" -> "Blueprint" -> selecciona este repositorio,
# y arma las dos apps solas leyendo este archivo. Solo falta rellenar
# los Secrets marcados "sync: false" (Render los deja en blanco por
# seguridad, nunca se guardan en este archivo ni se suben a GitHub).
#
# Las dos apps comparten el mismo Dockerfile (ver Dockerfile) -- cada
# una corre un archivo .py distinto, elegido con "dockerCommand".

services:
  - type: web
    name: aura-dashboard-nutriologas
    runtime: docker
    dockerCommand: streamlit run dashboard_pacientes.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true
    plan: starter
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: CONECTAR_GARMIN_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LIBRE_EMAIL
        sync: false
      - key: LIBRE_PASSWORD
        sync: false
      - key: OURA_CLIENT_ID
        sync: false
      - key: OURA_CLIENT_SECRET
        sync: false
      - key: CONECTAR_OURA_URL
        sync: false

  - type: web
    name: aura-conectar-garmin
    runtime: docker
    dockerCommand: streamlit run conectar_garmin_web.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false

  - type: web
    name: aura-conectar-oura
    runtime: docker
    dockerCommand: streamlit run conectar_oura_web.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OURA_CLIENT_ID
        sync: false
      - key: OURA_CLIENT_SECRET
        sync: false
      - key: CONECTAR_OURA_URL
        sync: false
